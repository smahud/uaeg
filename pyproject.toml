[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uaeg"
version = "0.4.2"
description = "UAEG - Universal Agent Execution Gateway: MCP-over-HTTPS bridge from hosted AI agents to full native execution on a Linux VPS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "smahud" }]
requires-python = ">=3.11"
keywords = ["mcp", "agent", "gateway", "vps", "execution", "remote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp==1.27.0",
    "starlette==0.50.0",
    "uvicorn==0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
uaeg = "uaeg.cli:main"

[project.urls]
Homepage = "https://github.com/smahud/uaeg"
Documentation = "https://github.com/smahud/uaeg/tree/main/docs"
Issues = "https://github.com/smahud/uaeg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uaeg = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
